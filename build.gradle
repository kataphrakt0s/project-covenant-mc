    classpath = sourceSets.geometryTest.runtimeClasspath
    mainClass = 'dev.covenant.client.ApplyFeedbackTest'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
