plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

sourceSets.main.resources.srcDir 'src/generated/resources'
sourceSets.main.resources.exclude '**/.cache/**'
sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    geometryTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

neoForge {
    version = project.neo_version
    addModdingDependenciesTo sourceSets.gameTest
    mods {
        "${mod_id}" { sourceSet sourceSets.main }
        covenant_test { sourceSet sourceSets.gameTest }
    }
    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.gameTest
            gameDirectory = project.file('runs/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'covenant_test'
            loadedMods = [mods.covenant, mods.covenant_test]
        }
        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources').absolutePath,
                    '--existing', file('src/main/resources').absolutePath
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
            if (name != 'gameTestServer') { loadedMods = [mods.covenant] }
        }
    }
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def properties = [mod_id: mod_id, mod_name: mod_name, mod_version: mod_version,
                      mod_license: mod_license, minecraft_version_range: minecraft_version_range,
                      neo_version: neo_version]
    inputs.properties properties
    expand properties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

// Dependency-free checks for the wheel's pure geometry; no game bootstrap required.
def radialMenuTest = tasks.register('radialMenuTest', JavaExec) {
    group = 'verification'
    description = 'Checks radial menu sectors, dead zone, and responsive bounds.'
    classpath = sourceSets.geometryTest.runtimeClasspath
    mainClass = 'dev.covenant.client.RadialMenuLayoutTest'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
}
tasks.named('check') { dependsOn radialMenuTest }

def skillTreeLayoutTest = tasks.register('skillTreeLayoutTest', JavaExec) {
    group = 'verification'
    description = 'Checks full skill tree visibility and separate node bounds across GUI sizes.'
    classpath = sourceSets.geometryTest.runtimeClasspath
    mainClass = 'dev.covenant.client.SkillTreeLayoutTest'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
}
tasks.named('check') { dependsOn skillTreeLayoutTest }

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
idea.module.downloadSources = true
idea.module.downloadJavadoc = true
