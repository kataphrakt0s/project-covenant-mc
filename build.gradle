tasks.named('check') { dependsOn applyFeedbackTest }

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
idea.module.downloadSources = true
idea.module.downloadJavadoc = true

// Runs the actual pinned GeckoLib parser/baker against a disposable headless MCP smoke export.
tasks.register('geckoAssetTest', JavaExec) {
    group = 'verification'
    description = 'Bakes and samples Blockbench gecko-smoke exports with the pinned GeckoLib runtime.'
    classpath = sourceSets.geckoExample.runtimeClasspath
    mainClass = 'dev.covenant.example.gecko.GeckoAssetTest'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
    if (providers.gradleProperty('geckoAssets').isPresent()) {
        args providers.gradleProperty('geckoAssets').get()
    }
}

// Exercises the production wolf export separately from disposable tooling fixtures.
tasks.register('wolfAnimationAssetTest', JavaExec) {
    group = 'verification'
    description = 'Bakes and samples the shipped wolf rig and five animation clips with GeckoLib.'
    classpath = sourceSets.geckoExample.runtimeClasspath
    mainClass = 'dev.covenant.example.gecko.WolfAnimationAssetTest'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
}
tasks.named('check') { dependsOn wolfAnimationAssetTest }

tasks.register('golemAssetTest', JavaExec) {
    group = 'verification'
    description = 'Bakes four golem forms and samples the shared body/core animations with GeckoLib.'
    classpath = sourceSets.geckoExample.runtimeClasspath
    mainClass = 'dev.covenant.example.gecko.GolemAssetTest'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
}
tasks.named('check') { dependsOn golemAssetTest }
