plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'GeckoLib'
                url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
            }
        }
        filter { includeGroup('com.geckolib') }
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'
sourceSets.main.resources.exclude '**/.cache/**'
sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    geometryTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    // Compile checked integration examples without registering or packaging them.
    geckoExample {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

configurations {
    gameTestImplementation.extendsFrom implementation
    devRuntimeMods {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
}

dependencies {
    implementation "com.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"
    devRuntimeMods "com.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"
}

// Standalone runtime dependencies for launcher/server installation; never shade into Covenant.
def stageDevRuntimeMods = tasks.register('stageDevRuntimeMods', Sync) {
    from configurations.devRuntimeMods
    into layout.buildDirectory.dir('runtime-mods')
}
tasks.named('build') { dependsOn stageDevRuntimeMods }
tasks.named('check') { dependsOn tasks.named('compileGeckoExampleJava') }

neoForge {
    version = project.neo_version
    addModdingDependenciesTo sourceSets.gameTest
    mods {
        "${mod_id}" { sourceSet sourceSets.main }
        covenant_test { sourceSet sourceSets.gameTest }
    }
    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.gameTest
            gameDirectory = project.file('runs/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'covenant_test'
            loadedMods = [mods.covenant, mods.covenant_test]
        }
        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources').absolutePath,
                    '--existing', file('src/main/resources').absolutePath
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
            if (name != 'gameTestServer') { loadedMods = [mods.covenant] }
        }
    }
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def properties = [mod_id: mod_id, mod_name: mod_name, mod_version: mod_version,
                      mod_license: mod_license, minecraft_version_range: minecraft_version_range,
                      neo_version: neo_version, geckolib_version: geckolib_version]
    inputs.properties properties
    expand properties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

// Dependency-free checks for the wheel's pure geometry; no game bootstrap required.
def radialMenuTest = tasks.register('radialMenuTest', JavaExec) {
    group = 'verification'
    description = 'Checks radial menu sectors, dead zone, and responsive bounds.'
    classpath = sourceSets.geometryTest.runtimeClasspath
    mainClass = 'dev.covenant.client.RadialMenuLayoutTest'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
}
tasks.named('check') { dependsOn radialMenuTest }

def lightningPathTest = tasks.register('lightningPathTest', JavaExec) {
    group = 'verification'
    description = 'Checks exact lightning endpoints, bounded jagged geometry and degenerate/vertical aim.'
    classpath = sourceSets.geometryTest.runtimeClasspath
    mainClass = 'dev.covenant.client.LightningPathTest'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
}
tasks.named('check') { dependsOn lightningPathTest }

